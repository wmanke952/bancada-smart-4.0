<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Unidade - SENAI Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue: #0067ff;
    --blue-2: #3ea8ff;
    --blue-deep: #0a4fb5;
    --orange: #ff6a00;
    --orange-2: #ffb300;
    --ink: #12151c;
    --muted: #5c6472;
    --paper: #f4f6fb;
    --card: #ffffff;
    --line: #e4e8f2;
    --green: #22c55e;
    --green-ink: #0d5c30;
    --red: #ef5350;
    --red-ink: #7a1414;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    font-family: 'Inter', 'Segoe UI', sans-serif;
    color: var(--ink);
    background: var(--paper);
  }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }
  h1,h2,h3{ font-family:'Poppins', 'Inter', sans-serif; }

  .app{ display:flex; min-height:100vh; }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width: 280px;
    flex-shrink:0;
    background: linear-gradient(165deg, var(--blue) 0%, var(--blue-2) 100%);
    display:flex;
    flex-direction:column;
    padding: 28px 0 24px;
  }
  .brand{
    background:#fff;
    margin: 0 24px 34px;
    border-radius: 14px;
    padding: 14px 18px;
    box-shadow: 0 8px 20px rgba(10,40,90,0.15);
  }
  .brand-row{ display:flex; align-items:center; gap:10px; }
  .brand-mark{ display:flex; flex-direction:column; gap:2px; }
  .brand-mark span{ display:block; height:3px; border-radius:2px; background: var(--blue); }
  .brand-mark span:nth-child(1){ width:12px; }
  .brand-mark span:nth-child(2){ width:18px; background: var(--orange); }
  .brand-mark span:nth-child(3){ width:15px; }
  .brand-logo{ font-family:'Poppins',sans-serif; font-size: 22px; font-weight:800; color: var(--blue); letter-spacing: 0.3px; }
  .brand-logo span{ color: var(--orange); }
  .brand-tag{ font-size: 9px; font-weight:700; letter-spacing: 1px; color: var(--blue-deep); margin-top:4px; text-transform:uppercase; }

  nav.nav-list{ display:flex; flex-direction:column; gap: 4px; padding: 0 18px; }
  .nav-item{
    display:flex; align-items:center; gap:12px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 15.5px;
    font-weight:500;
    color: rgba(255,255,255,0.72);
    cursor:pointer;
    border-left: 3px solid transparent;
    transition: background .15s ease, color .15s ease;
  }
  .nav-item svg{ width:18px; height:18px; flex-shrink:0; opacity:0.85; }
  .nav-item:hover{ color:#fff; background: rgba(255,255,255,0.09); }
  .nav-item.active{ color:#fff; background: rgba(255,255,255,0.18); border-left-color: var(--orange); font-weight:700; }

  .sidebar-foot{ margin-top:auto; padding: 0 18px; }
  .logout-link{
    display:block; text-align:center; padding: 10px 14px;
    border-radius: 10px; color: rgba(255,255,255,0.8); font-size: 13.5px;
    border: 1px solid rgba(255,255,255,0.32);
  }
  .logout-link:hover{ background: rgba(255,255,255,0.12); color:#fff; }

  /* ---------- MAIN ---------- */
  .main{
    flex:1;
    position:relative;
    overflow:hidden;
    padding: 44px 56px 60px;
    background:
      repeating-linear-gradient(115deg, transparent 0 140px, rgba(0,103,255,0.035) 140px 141px),
      var(--paper);
  }
  .deco-orange{
    position:absolute; top:-70px; right:-50px;
    width: 270px; height:200px;
    background: linear-gradient(135deg, var(--orange), #d95400);
    border-radius: 38px;
    transform: rotate(28deg);
    box-shadow: 0 20px 45px rgba(217,84,0,0.28);
    z-index:0; pointer-events:none;
  }
  .deco-dots{ position:absolute; display:grid; grid-template-columns: repeat(6,8px); gap:10px; z-index:0; pointer-events:none; }
  .deco-dots span{ width:5px; height:5px; border-radius:50%; background: var(--orange); opacity:.55; }
  .deco-dots.br{ right:40px; bottom:32px; }

  .page{ position:relative; z-index:1; animation: fadeIn .25s ease; max-width: 640px; }
  @keyframes fadeIn{ from{ opacity:0; transform: translateY(6px);} to{ opacity:1; transform:none; } }

  .page-head{ margin-bottom: 30px; }
  .page-head h1{ font-size: 32px; margin: 0 0 4px; font-weight:800; color: var(--ink); }
  .page-head p{ margin:0; color: var(--muted); font-size:15px; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12px; font-weight:700; letter-spacing:0.6px; color: var(--blue-deep);
    background: #e8f1ff; padding:6px 12px; border-radius:999px; margin-bottom:10px;
  }
  .eyebrow .dot{ width:6px; height:6px; border-radius:50%; background: var(--blue); }

  /* ---------- FORM PANEL ---------- */
  .form-panel{
    background: var(--card);
    border-radius: 20px;
    padding: 34px 36px;
    box-shadow: 0 14px 34px rgba(20,30,60,0.07);
    border: 1px solid var(--line);
  }

  .field{ margin-bottom: 22px; }
  .field label{
    display:block;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .field .hint{
    display:block;
    font-size: 12.5px;
    font-weight: 400;
    color: var(--muted);
    margin-top: 6px;
  }
  .field input[type="text"]{
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    background: #fbfcff;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field input[type="text"]:focus{
    outline:none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(0,103,255,0.12);
  }
  .field input::placeholder{ color: #a7adba; }

  .status-note{
    display:flex; align-items:center; gap:10px;
    background: #e8f1ff;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 13.5px;
    color: var(--blue-deep);
    margin-bottom: 26px;
  }
  .status-note .status-pill{
    display:inline-flex; align-items:center; gap:6px;
    padding: 5px 12px; border-radius:999px; font-size:12px; font-weight:800; letter-spacing:0.3px;
    background:#e3f9ec; color: var(--green-ink);
  }
  .status-note .status-pill .dot{ width:7px; height:7px; border-radius:50%; background: var(--green); }

  .form-actions{
    display:flex; gap:12px; margin-top: 8px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
  }
  .btn-action{
    border:none; border-radius: 10px; padding: 12px 24px;
    font-weight:700; font-size:14.5px; cursor:pointer;
  }
  .btn-save{ background: linear-gradient(135deg, var(--blue), var(--blue-2)); color:#fff; box-shadow: 0 10px 22px rgba(0,103,255,0.22); }
  .btn-save:hover{ filter:brightness(1.06); }
  .btn-cancel{ background:#eef0f5; color: var(--muted); }
  .btn-cancel:hover{ background:#e2e5ec; }

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed; top:24px; left:50%;
    transform: translateX(-50%) translateY(-140%);
    background: var(--ink); color:#fff;
    padding: 14px 24px; border-radius: 10px; font-size:14px; z-index:50;
    transition: transform .35s ease; box-shadow: 0 10px 25px rgba(0,0,0,0.25);
  }
  .toast.show{ transform: translateX(-50%) translateY(0); }

  @media (max-width: 900px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; overflow-x:auto; padding:16px; align-items:center; }
    .brand{ margin:0 12px 0 0; }
    nav.nav-list{ flex-direction:row; padding:0; }
    .sidebar-foot{ display:none; }
    .main{ padding: 28px 18px 40px; }
    .form-panel{ padding: 24px 20px; }
    .form-actions{ flex-direction:column; }
    .btn-action{ width:100%; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-row">
        <div class="brand-mark"><span></span><span></span><span></span></div>
        <div class="brand-logo">SENA<span>I</span></div>
      </div>
      <div class="brand-tag">Pelo futuro do trabalho</div>
    </div>

    <nav class="nav-list">
      <a class="nav-item" href="admin.html#dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>
      <a class="nav-item" href="admin.html#usuarios">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c0-4.1 3.4-6.6 7.5-6.6s7.5 2.5 7.5 6.6"/></svg>
        Usuários
      </a>
      <a class="nav-item active" href="unidades.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V6l8-3 8 3v15"/><path d="M9 21v-6h6v6"/><path d="M9 10h.01M15 10h.01M9 14h.01M15 14h.01"/></svg>
        Unidades
      </a>
      <a class="nav-item" href="admin.html#bancadas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/></svg>
        Bancadas
      </a>
      <a class="nav-item" href="admin.html#pedidos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v3h6V3M8 11h8M8 15h5"/></svg>
        Pedidos
      </a>
      <a class="nav-item" href="admin.html#relatorios">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M11 20V4M18 20v-7"/></svg>
        Relatórios
      </a>
    </nav>

    <div class="sidebar-foot">
      <a class="logout-link" href="login-senai.html">Sair</a>
    </div>
  </aside>

  <main class="main">
    <div class="deco-orange"></div>
    <div class="deco-dots br">
      <span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="page">
      <div class="page-head">
        <div class="eyebrow"><span class="dot"></span> RF03 · Gerenciamento de Unidades</div>
        <h1 id="formTitle">Nova unidade</h1>
        <p id="formSubtitle">Preencha os dados para cadastrar uma unidade SENAI</p>
      </div>

      <div class="form-panel">
        <div class="status-note" id="statusNote">
          <span>O status inicial é definido automaticamente:</span>
          <span class="status-pill"><span class="dot"></span>ATIVA</span>
        </div>

        <form id="formUnidade" novalidate>
          <input type="hidden" id="unidadeId" name="unidadeId" value="">

          <div class="field">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Ex.: SENAI Blumenau" autocomplete="off" required>
          </div>

          <div class="field">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" placeholder="Ex.: Blumenau" autocomplete="off" required>
          </div>

          <div class="field">
            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" name="endereco" placeholder="Ex.: Rua Exemplo, 123" autocomplete="off" required>
            <span class="hint">Informe rua, número e complemento, se houver.</span>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-action btn-save" id="btnSalvar">Salvar</button>
            <button type="button" class="btn-action btn-cancel" id="btnCancelar">Cancelar</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   RF03 — Formulário de Unidade (Cadastro / Edição)
   Nesta etapa: apenas validação e feedback visual (sem chamada a API).
   Uma nova unidade é sempre criada como ATIVA pelo backend, por isso o
   campo de status não é exibido no formulário.
   ===================================================================== */

function showToast(text){
  const toast = document.getElementById('toast');
  toast.textContent = text;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 2400);
}

const form = document.getElementById('formUnidade');
const inputNome = document.getElementById('nome');
const inputCidade = document.getElementById('cidade');
const inputEndereco = document.getElementById('endereco');
const inputId = document.getElementById('unidadeId');

/* --------- Preenche o formulário quando vier em modo edição ---------
   Ex.: unidade-form.html?id=1&nome=SENAI+Blumenau&cidade=Blumenau&endereco=Rua+Exemplo,+123
------------------------------------------------------------------------ */
(function preencherSeEdicao(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if(!id) return;

  inputId.value = id;
  inputNome.value = params.get('nome') || '';
  inputCidade.value = params.get('cidade') || '';
  inputEndereco.value = params.get('endereco') || '';

  document.getElementById('formTitle').textContent = 'Editar unidade';
  document.getElementById('formSubtitle').textContent = 'Atualize os dados da unidade SENAI';
  document.getElementById('statusNote').style.display = 'none';
})();

form.addEventListener('submit', (e) => {
  e.preventDefault();

  const nome = inputNome.value.trim();
  const cidade = inputCidade.value.trim();
  const endereco = inputEndereco.value.trim();

  if(!nome || !cidade || !endereco){
    showToast('Preencha nome, cidade e endereço.');
    return;
  }

  /* Nesta etapa não há envio para API — apenas feedback visual. */
  const mensagem = inputId.value
    ? `Unidade "${nome}" pronta para atualização.`
    : `Unidade "${nome}" pronta para cadastro (status ATIVA).`;
  showToast(mensagem);
});

document.getElementById('btnCancelar').addEventListener('click', () => {
  window.location.href = 'unidades.html';
});
</script>

</body>
</html>
